name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Multi-Arch Binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: Compile Multi-Arch Binaries
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME:-v2026.2}"
          if [[ ! "${TAG_NAME}" =~ ^v?[0-9] ]]; then
            TAG_NAME="v2026.2"
          fi
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "release")
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.Version=${TAG_NAME} -X main.GitCommit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/telcosec-linux-amd64 ./cmd/telcosec
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/telcosec-linux-arm64 ./cmd/telcosec
          # macOS AMD64 (Intel)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/telcosec-darwin-amd64 ./cmd/telcosec
          # macOS ARM64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/telcosec-darwin-arm64 ./cmd/telcosec

          chmod +x dist/*

          cd dist
          tar -czvf "telcosec_${TAG_NAME}_linux_amd64.tar.gz" telcosec-linux-amd64
          tar -czvf "telcosec_${TAG_NAME}_linux_arm64.tar.gz" telcosec-linux-arm64
          tar -czvf "telcosec_${TAG_NAME}_darwin_amd64.tar.gz" telcosec-darwin-amd64
          tar -czvf "telcosec_${TAG_NAME}_darwin_arm64.tar.gz" telcosec-darwin-arm64
          sha256sum *.tar.gz > SHA256SUMS

      - name: Build Debian Packages (AMD64 & ARM64)
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev

          if [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9] ]]; then
            TAG_CLEAN="${GITHUB_REF_NAME#v}"
            sed -i "1s/telcosec-cli ([^)]*)/telcosec-cli (${TAG_CLEAN}-1)/" debian/changelog
          fi

          # Build AMD64 and ARM64 packages
          dpkg-buildpackage -us -uc -b -aamd64 -d
          dpkg-buildpackage -us -uc -b -aarm64 -d

          mv ../telcosec-cli_*.deb dist/
          cd dist
          sha256sum *.deb >> SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Dispatch Homebrew Tap Formula Bump
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v2026.2}"
          ARCHIVE_URL="https://github.com/TelcoChisel/telcosec-cli/archive/refs/tags/${TAG_NAME}.tar.gz"
          echo "[+] Fetching source archive to calculate SHA256: ${ARCHIVE_URL}"

          HTTP_STATUS=$(curl -sL -w "%{http_code}" -o archive.tar.gz "${ARCHIVE_URL}" || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ] && [ -s archive.tar.gz ]; then
            SHA256=$(sha256sum archive.tar.gz | awk '{print $1}')
            rm -f archive.tar.gz
            echo "[+] Archive SHA256: ${SHA256}"

            if [ -n "${TAP_TOKEN:-}" ]; then
              echo "[+] Notifying TelcoChisel/homebrew-tap to bump formula..."
              curl -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token ${TAP_TOKEN}" \
                https://api.github.com/repos/TelcoChisel/homebrew-tap/dispatches \
                -d "{\"event_type\": \"bump-formula\", \"client_payload\": {\"version\": \"${TAG_NAME}\", \"sha256\": \"${SHA256}\"}}"
              echo "[+] Successfully triggered homebrew-tap bump!"
            else
              echo "[!] HOMEBREW_TAP_TOKEN secret not set. Skipping automatic tap bump."
              echo "[i] Run 'Bump Formula' workflow in TelcoChisel/homebrew-tap with version=${TAG_NAME} and sha256=${SHA256}"
            fi
          else
            echo "[!] Warning: Release archive not yet available or failed download (status ${HTTP_STATUS})"
          fi
