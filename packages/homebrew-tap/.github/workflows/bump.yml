name: Bump Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag or Version to bump to (e.g. v3.0.1 or 3.0.1)'
        required: true
        type: string
  repository_dispatch:
    types: [bump-formula]

permissions:
  contents: write

jobs:
  bump:
    name: Bump Formula & Verify Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Version & Fetch Archive SHA256
        id: fetch
        run: |
          RAW_VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          if [ -z "$RAW_VERSION" ]; then
            echo "[!] Error: No version supplied."
            exit 1
          fi

          # Normalize tags: ensure TAG_NAME has 'v' prefix and CLEAN_VER has no 'v' prefix
          CLEAN_VER="${RAW_VERSION#v}"
          TAG_NAME="v${CLEAN_VER}"
          ARCHIVE_URL="https://github.com/TelcoChisel/telcosec-cli/archive/refs/tags/${TAG_NAME}.tar.gz"

          echo "[+] Resolving release archive: ${ARCHIVE_URL}"
          HTTP_STATUS=$(curl -sL -w "%{http_code}" -o archive.tar.gz "${ARCHIVE_URL}")

          if [ "$HTTP_STATUS" -ne 200 ] || [ ! -s archive.tar.gz ]; then
            echo "[!] Error: Failed to fetch archive from ${ARCHIVE_URL} (HTTP status: ${HTTP_STATUS})"
            exit 1
          fi

          SHA256=$(sha256sum archive.tar.gz | awk '{print $1}')
          rm -f archive.tar.gz

          echo "[+] Verified SHA256: ${SHA256}"
          {
            echo "tag_name=${TAG_NAME}"
            echo "version=${CLEAN_VER}"
            echo "sha256=${SHA256}"
            echo "url=${ARCHIVE_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Update Formula
        run: |
          TAG_NAME="${{ steps.fetch.outputs.tag_name }}"
          SHA256="${{ steps.fetch.outputs.sha256 }}"
          ARCHIVE_URL="${{ steps.fetch.outputs.url }}"

          echo "[+] Updating Formula/telcosec.rb with ${TAG_NAME} (${SHA256})..."
          sed -i -E "s|url \"https://github.com/TelcoChisel/telcosec-cli/archive/refs/tags/[^\"]+\"|url \"${ARCHIVE_URL}\"|" Formula/telcosec.rb
          sed -i -E "s|sha256 \"[a-f0-9]{64}\"|sha256 \"${SHA256}\"|" Formula/telcosec.rb

          git diff Formula/telcosec.rb

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Verify Tap Syntax
        run: brew test-bot --only-tap-syntax

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${{ steps.fetch.outputs.tag_name }}"
          git add Formula/telcosec.rb
          if git diff --cached --quiet; then
            echo "[+] Formula is already up to date with ${TAG_NAME}. Nothing to commit."
          else
            git commit -m "chore(formula): bump telcosec to ${TAG_NAME}"
            git push origin main
            echo "[+] Successfully committed and pushed formula bump to ${TAG_NAME}!"
          fi
