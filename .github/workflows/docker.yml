name: Build and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to publish (e.g. v2026.2 or latest)'
        required: false
        default: 'latest'
      publish_ghcr:
        description: 'Publish to GitHub Container Registry (ghcr.io)'
        type: boolean
        required: false
        default: true
      publish_dockerhub:
        description: 'Publish to Docker Hub (docker.io)'
        type: boolean
        required: false
        default: false
      publish_digitalocean:
        description: 'Publish to DigitalOcean Container Registry (registry.digitalocean.com)'
        type: boolean
        required: false
        default: false
      do_registry:
        description: 'DigitalOcean Registry Name (e.g. telcochisel)'
        required: false
        default: 'telcochisel'
      update_descriptions:
        description: 'Sync Markdown documentation to Docker Hub repository overview'
        type: boolean
        required: false
        default: true
      run_smoke_tests:
        description: 'Execute post-publish sanity tests on images'
        type: boolean
        required: false
        default: true
  push:
    tags: ['v*.*.*', 'v*.*']

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DO: registry.digitalocean.com
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'telcochisel' }}
  DO_REGISTRY_DEFAULT: ${{ secrets.DO_REGISTRY_NAME || secrets.DO_REGISTRY || 'telcochisel' }}

jobs:
  # ─── 1. Build and Publish Base Image ──────────────────────────────────────────
  # telcochisel-base is the foundation for all add-on images.
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      clean_version: ${{ steps.meta.outputs.clean_version }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      base_tag: ${{ steps.meta.outputs.base_tag }}
      has_ghcr: ${{ steps.meta.outputs.has_ghcr }}
      has_dockerhub: ${{ steps.meta.outputs.has_dockerhub }}
      has_do: ${{ steps.meta.outputs.has_do }}
      do_registry: ${{ steps.meta.outputs.do_registry }}
      smoke_tag: ${{ steps.tags.outputs.smoke_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve metadata and registry readiness
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ] && [ "${{ github.event.inputs.version_tag }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="v2026.2"
          fi
          CLEAN_VERSION="${VERSION#v}"
          COMMIT_SHA=$(git rev-parse --short HEAD)

          # Tag pushes: GHCR only (cheapest default). Hub/DO require an
          # explicit workflow_dispatch toggle (defaults false).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT_GHCR="${{ github.event.inputs.publish_ghcr != 'false' }}"
            WANT_DH="${{ github.event.inputs.publish_dockerhub == 'true' }}"
            WANT_DO="${{ github.event.inputs.publish_digitalocean == 'true' }}"
          else
            WANT_GHCR="true"
            WANT_DH="false"
            WANT_DO="false"
          fi

          HAS_GHCR="${WANT_GHCR}"
          HAS_DH="false"
          if [ "${WANT_DH}" = "true" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            HAS_DH="true"
          fi

          HAS_DO="false"
          DO_TOKEN="${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DO_TOKEN || secrets.DO_REGISTRY_TOKEN }}"
          if [ "${WANT_DO}" = "true" ] && [ -n "${DO_TOKEN}" ]; then
            HAS_DO="true"
          fi

          DO_REG="${{ github.event.inputs.do_registry || env.DO_REGISTRY_DEFAULT }}"

          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_tag=${{ env.REGISTRY_GHCR }}/${OWNER_LC}/telcochisel-base:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "has_ghcr=${HAS_GHCR}" >> "$GITHUB_OUTPUT"
          echo "has_dockerhub=${HAS_DH}" >> "$GITHUB_OUTPUT"
          echo "has_do=${HAS_DO}" >> "$GITHUB_OUTPUT"
          echo "do_registry=${DO_REG}" >> "$GITHUB_OUTPUT"

          echo "=== Registry Resolution ==="
          echo "GitHub Container Registry (GHCR): ${HAS_GHCR}"
          echo "Docker Hub (${DOCKERHUB_NAMESPACE}): ${HAS_DH}"
          echo "DigitalOcean Container Registry (${DO_REG}): ${HAS_DO}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.meta.outputs.has_ghcr == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.has_dockerhub == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to DigitalOcean Container Registry (DOCR)
        if: steps.meta.outputs.has_do == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY_DO }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DO_TOKEN || secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DO_TOKEN || secrets.DO_REGISTRY_TOKEN }}

      - name: Generate multi-registry tags for telcochisel-base
        id: tags
        run: |
          TAGS=""
          OWNER="${{ steps.meta.outputs.owner_lc }}"
          VER="${{ steps.meta.outputs.version }}"
          C_VER="${{ steps.meta.outputs.clean_version }}"
          SHA="${{ steps.meta.outputs.commit_sha }}"
          SMOKE_TAG=""

          # GHCR Tags
          if [ "${{ steps.meta.outputs.has_ghcr }}" = "true" ]; then
            TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-base:latest"
            TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-base:${VER}"
            if [ -n "${C_VER}" ] && [ "${C_VER}" != "${VER}" ]; then
              TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-base:${C_VER}"
            fi
            TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-base:sha-${SHA}"
            SMOKE_TAG="${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-base:${VER}"
          fi

          # Docker Hub Tags
          if [ "${{ steps.meta.outputs.has_dockerhub }}" = "true" ]; then
            DH_NS="${{ env.DOCKERHUB_NAMESPACE }}"
            TAGS="${TAGS},${DH_NS}/telcochisel-base:latest"
            TAGS="${TAGS},${DH_NS}/telcochisel-base:${VER}"
            if [ -n "${C_VER}" ] && [ "${C_VER}" != "${VER}" ]; then
              TAGS="${TAGS},${DH_NS}/telcochisel-base:${C_VER}"
            fi
            TAGS="${TAGS},${DH_NS}/telcochisel-base:sha-${SHA}"
            [ -z "$SMOKE_TAG" ] && SMOKE_TAG="${DH_NS}/telcochisel-base:${VER}"
          fi

          # DigitalOcean Container Registry Tags
          if [ "${{ steps.meta.outputs.has_do }}" = "true" ]; then
            DO_NS="${{ steps.meta.outputs.do_registry }}"
            TAGS="${TAGS},${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-base:latest"
            TAGS="${TAGS},${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-base:${VER}"
            if [ -n "${C_VER}" ] && [ "${C_VER}" != "${VER}" ]; then
              TAGS="${TAGS},${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-base:${C_VER}"
            fi
            TAGS="${TAGS},${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-base:sha-${SHA}"
            [ -z "$SMOKE_TAG" ] && SMOKE_TAG="${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-base:${VER}"
          fi

          TAGS="${TAGS#,}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "smoke_tag=${SMOKE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push telcochisel-base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/base.Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.clean_version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=telcochisel-base
          cache-to: type=gha,mode=min,scope=telcochisel-base

      - name: Verify telcochisel-base healthcheck
        if: github.event.inputs.run_smoke_tests != 'false' && steps.tags.outputs.smoke_tag != ''
        run: |
          echo "Pulling and executing healthcheck on ${{ steps.tags.outputs.smoke_tag }}..."
          docker run --rm --entrypoint /bin/bash ${{ steps.tags.outputs.smoke_tag }} -c "/usr/local/bin/container-healthcheck.sh"
          echo "✓ telcochisel-base healthcheck passed!"

      - name: Sync Docker Hub Description for base
        if: steps.meta.outputs.has_dockerhub == 'true' && github.event.inputs.update_descriptions != 'false'
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-base
          readme-filepath: docker/descriptions/base.md
          short-description: "TelcoSec TelcoChisel Base — Headless CLI telecom security penetration testing and research toolset"

  # ─── 2. Build and Publish Add-On Specialized Images ───────────────────────────
  # Specialized suites (SDR, Core Network, Device Tools) build in parallel.
  add-ons:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sdr
            short_desc: "TelcoSec TelcoChisel SDR — Software Defined Radio cellular research toolchain"
          - image: core-network
            short_desc: "TelcoSec TelcoChisel Core Network — 4G/5G SA core & RAN emulation & exploitation"
          - image: device-tools
            short_desc: "TelcoSec TelcoChisel Device Tools — Mobile device & baseband flashing & diagnostics"
          - image: 5ghoul
            short_desc: "TelcoSec TelcoChisel 5Ghoul — BladeRF-first 5G NR research image"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        if: needs.base.outputs.has_ghcr == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.base.outputs.has_dockerhub == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to DigitalOcean Container Registry (DOCR)
        if: needs.base.outputs.has_do == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY_DO }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DO_TOKEN || secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DO_TOKEN || secrets.DO_REGISTRY_TOKEN }}

      - name: Generate multi-registry tags for telcochisel-${{ matrix.image }}
        id: tags
        run: |
          TAGS=""
          OWNER="${{ needs.base.outputs.owner_lc }}"
          VER="${{ needs.base.outputs.version }}"
          C_VER="${{ needs.base.outputs.clean_version }}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          SMOKE_TAG=""

          # GHCR Tags
          if [ "${{ needs.base.outputs.has_ghcr }}" = "true" ]; then
            TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-${{ matrix.image }}:latest"
            TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-${{ matrix.image }}:${VER}"
            if [ -n "${C_VER}" ] && [ "${C_VER}" != "${VER}" ]; then
              TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-${{ matrix.image }}:${C_VER}"
            fi
            TAGS="${TAGS},${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-${{ matrix.image }}:sha-${COMMIT_SHA}"
            SMOKE_TAG="${{ env.REGISTRY_GHCR }}/${OWNER}/telcochisel-${{ matrix.image }}:${VER}"
          fi

          # Docker Hub Tags
          if [ "${{ needs.base.outputs.has_dockerhub }}" = "true" ]; then
            DH_NS="${{ env.DOCKERHUB_NAMESPACE }}"
            TAGS="${TAGS},${DH_NS}/telcochisel-${{ matrix.image }}:latest"
            TAGS="${TAGS},${DH_NS}/telcochisel-${{ matrix.image }}:${VER}"
            if [ -n "${C_VER}" ] && [ "${C_VER}" != "${VER}" ]; then
              TAGS="${TAGS},${DH_NS}/telcochisel-${{ matrix.image }}:${C_VER}"
            fi
            TAGS="${TAGS},${DH_NS}/telcochisel-${{ matrix.image }}:sha-${COMMIT_SHA}"
            [ -z "$SMOKE_TAG" ] && SMOKE_TAG="${DH_NS}/telcochisel-${{ matrix.image }}:${VER}"
          fi

          # DigitalOcean Container Registry Tags
          if [ "${{ needs.base.outputs.has_do }}" = "true" ]; then
            DO_NS="${{ needs.base.outputs.do_registry }}"
            TAGS="${TAGS},${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-${{ matrix.image }}:latest"
            TAGS="${TAGS},${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-${{ matrix.image }}:${VER}"
            if [ -n "${C_VER}" ] && [ "${C_VER}" != "${VER}" ]; then
              TAGS="${TAGS},${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-${{ matrix.image }}:${C_VER}"
            fi
            TAGS="${TAGS},${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-${{ matrix.image }}:sha-${COMMIT_SHA}"
            [ -z "$SMOKE_TAG" ] && SMOKE_TAG="${{ env.REGISTRY_DO }}/${DO_NS}/telcochisel-${{ matrix.image }}:${VER}"
          fi

          TAGS="${TAGS#,}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "smoke_tag=${SMOKE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push telcochisel-${{ matrix.image }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.base.outputs.base_tag }}
            VERSION=${{ needs.base.outputs.clean_version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=telcochisel-${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=telcochisel-${{ matrix.image }}

      - name: Verify telcochisel-${{ matrix.image }} healthcheck
        if: github.event.inputs.run_smoke_tests != 'false' && steps.tags.outputs.smoke_tag != ''
        run: |
          echo "Pulling and executing healthcheck on ${{ steps.tags.outputs.smoke_tag }}..."
          docker run --rm --entrypoint /bin/bash ${{ steps.tags.outputs.smoke_tag }} -c "/usr/local/bin/container-healthcheck.sh"
          echo "✓ telcochisel-${{ matrix.image }} healthcheck passed!"

      - name: Sync Docker Hub Description for ${{ matrix.image }}
        if: needs.base.outputs.has_dockerhub == 'true' && github.event.inputs.update_descriptions != 'false'
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-${{ matrix.image }}
          readme-filepath: docker/descriptions/${{ matrix.image }}.md
          short-description: ${{ matrix.short_desc }}

  # ─── 3. Deployment Summary ────────────────────────────────────────────────────
  summary:
    needs: [base, add-ons]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Output Pipeline Summary
        run: |
          echo "## 🚀 TelcoChisel Container Release Matrix" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target Registry | Registry URI | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "${{ needs.base.outputs.has_ghcr }}" = "true" ]; then
            echo "| **GitHub Container Registry (GHCR)** | \`ghcr.io/${{ needs.base.outputs.owner_lc }}/telcochisel-*\` | ✅ Published |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **GitHub Container Registry (GHCR)** | \`ghcr.io/${{ needs.base.outputs.owner_lc }}/telcochisel-*\` | ⚪ Disabled |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.base.outputs.has_dockerhub }}" = "true" ]; then
            echo "| **Docker Hub** | \`docker.io/${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-*\` | ✅ Published |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Docker Hub** | \`docker.io/${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-*\` | ⚠️ Skipped (Set \`DOCKERHUB_TOKEN\` secret) |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.base.outputs.has_do }}" = "true" ]; then
            echo "| **DigitalOcean Container Registry** | \`registry.digitalocean.com/${{ needs.base.outputs.do_registry }}/telcochisel-*\` | ✅ Published |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **DigitalOcean Container Registry** | \`registry.digitalocean.com/${{ needs.base.outputs.do_registry }}/telcochisel-*\` | ⚠️ Skipped (Set \`DIGITALOCEAN_ACCESS_TOKEN\` secret) |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version Tag:** \`${{ needs.base.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Base Image:** \`${{ needs.base.outputs.base_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🎓 *Test these containers with guided telecom exploit scenarios at [TelcoSec Academy](https://app.telcosec.net)*." >> "$GITHUB_STEP_SUMMARY"
