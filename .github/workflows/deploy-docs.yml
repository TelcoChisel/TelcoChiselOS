name: Deploy Documentation to GitHub Pages

# The public site lives in TelcoChisel/website (telcochisel.com).
# This workflow is retained as a manual pointer / no-op so old badges do not 404.
on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-24.04
    steps:
      - name: Site moved
        run: |
          echo "telcochisel.com is built from https://github.com/TelcoChisel/website"
          echo "Catalog updates: push data/tools.json (notify-website.yml) or workflow_dispatch on the website repo."
