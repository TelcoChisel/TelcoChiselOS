name: Build and Release TelcoChisel

on:
  push:
    tags: ['v*.*.*', 'v*.*']
  schedule:
    - cron: '0 2 * * 0'   # weekly — Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly   # build + push to SF rolling/, update rolling pre-release
          - patch     # bump x.y.Z → x.y.Z+1, create versioned release
          - minor     # bump x.Y.z → x.Y+1.0, create versioned release
          - major     # bump X.y.z → X+1.0.0, create versioned release
      build_flavor:
        description: 'Distro flavor to build'
        required: false
        default: 'full'
        type: choice
        options:
          - full      # Flagship Field Edition (~5.0 GB, all 100 tools)
          - lite      # Modular Lite Edition (~1.8 GB, base + telcosec-pkg)
      allow_tool_failures:
        description: 'Ship even if some tool builds fail (TELCOSEC_ALLOW_TOOL_FAILURES)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false   # never cancel a running build mid-way

# Self-hosted runner requirements (Ubuntu 24.04+ host):
#   - passwordless sudo for the runner user (build-iso.sh runs under sudo -E)
#   - ~20 GB free disk in the runner work dir + /var
#   - first run: the "Install Build Dependencies" step bootstraps the toolchain;
#     it is skipped on later runs (everything persists on the host disk)
#   - apt-cacher-ng persists on the host between runs, so the hosted-runner
#     actions/cache save/restore steps are skipped on self-hosted
# Flip `runs-on` back to `ubuntu-24.04` to return to GitHub-hosted runners —
# all hosted-only steps are gated on RUNNER_ENVIRONMENT.
# NOTE: ISO is intentionally absent here — it is set per-run by the
# "Set ISO Environment Name" step via $GITHUB_ENV (versioned or nightly
# name). A static default here would shadow that and cause stale filenames.
env:
  SF_PROJECT: telcochisel
  SF_HOST: frs.sourceforge.net
  # Booleans only — inject SF_SSH_KEY / SF_USER / SF_API_KEY only in steps that need them.
  HAS_SF_KEY: ${{ secrets.SF_SSH_KEY != '' }}
  HAS_SF_API: ${{ secrets.SF_API_KEY != '' }}

jobs:
  # Weekly cron: skip the whole build when main hasn't moved since the last
  # nightly (the "rolling" tag marks the commit it was built from) — avoids
  # rebuilding and re-uploading an identical ~6 GB ISO every week.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST=$(gh api "repos/${{ github.repository }}/git/ref/tags/rolling" -q .object.sha 2>/dev/null || true)
            if [ "$LAST" = "${{ github.sha }}" ]; then
              BUILD=false
              echo "::notice::main unchanged since last nightly (${LAST:0:7}) — skipping build"
            fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Schedule/nightly only needs HEAD; tag/version bumps need full history + tags.
          fetch-depth: ${{ github.event_name == 'schedule' && 1 || 0 }}
          fetch-tags: ${{ github.event_name != 'schedule' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Determine version & release mode ────────────────────────────────────
      - name: Resolve Version & Flavor
        id: version
        run: |
          RELEASE_TYPE="${{ inputs.release_type }}"
          FLAVOR="${{ inputs.build_flavor || 'full' }}"
          # Weekly cron stays on the lite ISO — full builds are tag / manual only.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FLAVOR="lite"
            RELEASE_TYPE="nightly"
          fi
          # tag push always produces a versioned release, overriding the input
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            IS_NIGHTLY=false
          elif [[ -z "$RELEASE_TYPE" || "$RELEASE_TYPE" == "nightly" ]]; then
            VERSION="nightly-$(git rev-parse --short HEAD)"
            IS_NIGHTLY=true
          else
            # Bump version from latest git tag (source of truth); VERSION file
            # is only a fallback. Prevents building a stale version if the file
            # drifts from the last published release tag.
            LATEST_TAG=$(git tag --list 'v*.*' --sort=-version:refname 2>/dev/null | head -1 || true)
            if [[ -n "$LATEST_TAG" ]]; then
              CURRENT="${LATEST_TAG#v}"
            elif [ -f "VERSION" ]; then
              CURRENT=$(head -n 1 VERSION | tr -d '[:space:]')
            else
              CURRENT="0.0.0"
            fi
            IFS='.' read -r VER_MAJOR VER_MINOR VER_PATCH <<< "$CURRENT"
            case "$RELEASE_TYPE" in
              patch) VER_PATCH=$(( VER_PATCH + 1 )) ;;
              minor) VER_MINOR=$(( VER_MINOR + 1 )); VER_PATCH=0 ;;
              major) VER_MAJOR=$(( VER_MAJOR + 1 )); VER_MINOR=0; VER_PATCH=0 ;;
            esac
            BUMPED="${VER_MAJOR}.${VER_MINOR}.${VER_PATCH}"
            printf '%s\n' "$BUMPED" > VERSION
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name  "github-actions[bot]"
            git add VERSION
            git commit -m "chore: bump version to ${BUMPED} [skip ci]"
            git push origin HEAD:main
            VERSION="v${BUMPED}"
            IS_NIGHTLY=false
          fi
          CLEAN_VERSION="${VERSION#v}"
          if [ "$FLAVOR" = "lite" ]; then
            ISO_NAME="TelcoChisel-${CLEAN_VERSION}-lite-amd64.iso"
          else
            ISO_NAME="TelcoChisel-${CLEAN_VERSION}-amd64.iso"
          fi
          echo "version=$VERSION"         >> "$GITHUB_OUTPUT"
          echo "clean_version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR"           >> "$GITHUB_OUTPUT"
          echo "is_nightly=$IS_NIGHTLY"   >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "iso_name=$ISO_NAME"       >> "$GITHUB_OUTPUT"
          # Allow shipping with failed tool builds when explicitly requested via
          # dispatch, OR when a tag push re-cuts the version currently pending in
          # the VERSION file (deliberate re-release of a known-incomplete build).
          ALLOW_TOOL_FAILURES=false
          if [ "${{ inputs.allow_tool_failures }}" = "true" ]; then
            ALLOW_TOOL_FAILURES=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]] && [ -f VERSION ] \
               && [ "$CLEAN_VERSION" = "$(head -n1 VERSION | tr -d '[:space:]')" ]; then
            ALLOW_TOOL_FAILURES=true
          fi
          echo "allow_tool_failures=$ALLOW_TOOL_FAILURES" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$VERSION, clean_version=$CLEAN_VERSION, flavor=$FLAVOR (nightly=$IS_NIGHTLY, iso=$ISO_NAME, allow_tool_failures=$ALLOW_TOOL_FAILURES)"

      - name: Set ISO Environment Name
        run: |
          echo "ISO=${{ steps.version.outputs.iso_name }}" >> "$GITHUB_ENV"
          echo "BUILD_FLAVOR=${{ steps.version.outputs.flavor }}" >> "$GITHUB_ENV"

      # ── Hosted-runner-only: purge preinstalled bloat to make room ────────────
      - name: Free Disk Space
        if: env.RUNNER_ENVIRONMENT == 'github-hosted'
        run: |
          sudo rm -rf \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift \
            /usr/local/lib/node_modules /opt/hostedtoolcache /imagegeneration \
            /usr/share/man /usr/share/doc
          sudo docker image prune -af || true
          sudo docker system prune -af --volumes || true
          df -h /

      # Idempotent on both runner types: on self-hosted this is a fast no-op
      # after the first run (tools persist on the host).
      - name: Install Build Dependencies
        run: |
          MISSING=()
          for t in debootstrap mksquashfs grub-mkrescue xorriso mformat ccache rsync; do
            command -v "$t" >/dev/null 2>&1 || MISSING+=("$t")
          done
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            sudo apt-get update -q
            sudo apt-get install -y \
              debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin \
              shim-signed grub-efi-amd64-signed \
              xorriso mtools zstd apt-cacher-ng ccache rsync
          fi
          sudo ccache --max-size=4G

      - name: Configure apt-cacher-ng
        run: |
          sudo sed -i 's/^# PassThroughPattern:.*/PassThroughPattern: .*/' \
            /etc/apt-cacher-ng/acng.conf || true
          sudo systemctl restart apt-cacher-ng

      # Weekly-rotated cache keys: actions/cache keys are immutable, so a
      # unique key every run (e.g. github.run_id) uploads multi-GB blobs every
      # time. One key per ISO week reuses the cache within the week and still
      # refreshes via restore-keys when the content hash changes.
      # Hosted runners only — self-hosted keeps apt-cacher-ng/ccache on disk.
      - name: Cache week id
        if: env.RUNNER_ENVIRONMENT == 'github-hosted'
        id: cacheweek
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Restore apt-cacher-ng cache
        if: env.RUNNER_ENVIRONMENT == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /var/cache/apt-cacher-ng
          key: acng-noble-${{ hashFiles('builder/scripts/00-install-all-packages.sh') }}-${{ steps.cacheweek.outputs.week }}
          restore-keys: |
            acng-noble-${{ hashFiles('builder/scripts/00-install-all-packages.sh') }}-
            acng-noble-

      - name: Set apt-cacher-ng ownership
        run: |
          sudo mkdir -p /var/cache/apt-cacher-ng
          sudo chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng || true

      - name: Restore ccache
        if: env.RUNNER_ENVIRONMENT == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /root/.ccache
          key: ccache-${{ hashFiles('builder/scripts/*.sh') }}-${{ steps.cacheweek.outputs.week }}
          restore-keys: |
            ccache-${{ hashFiles('builder/scripts/*.sh') }}-
            ccache-

      # ── Build ────────────────────────────────────────────────────────────────
      # Catalog parity only needs Node for the sync script (no npm install).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # Same parity check deploy-docs runs — a drifted catalog must not ship
      # inside the ISO just because the docs deploy didn't run.
      - name: Verify tool catalog parity
        run: node scripts/sync-catalogs.js

      - name: Build ISO
        timeout-minutes: 180
        env:
          APT_PROXY: http://localhost:3142
          USE_CCACHE: "1"
          CCACHE_DIR: /root/.ccache
          # Max zstd compression for published releases — keeps the ISO under
          # the 5 GB SourceForge budget. Slower, but well within the 180-min
          # timeout. Nightlies/CI still use the fast level via their own env.
          SQUASHFS_LEVEL: "19"
          ISO_VERSION: ${{ steps.version.outputs.version }}
          BUILD_FLAVOR: ${{ steps.version.outputs.flavor }}
          TELCOSEC_ALLOW_TOOL_FAILURES: ${{ steps.version.outputs.allow_tool_failures == 'true' && '1' || '0' }}
        run: |
          sudo -E bash build-iso.sh --version="${{ steps.version.outputs.version }}" --flavor="${{ steps.version.outputs.flavor }}"
          sudo chown -R "$(id -u):$(id -g)" .
          if [ ! -f "$ISO" ]; then
            echo "::error::Expected ISO '$ISO' not found on disk after build-iso.sh completed!"
            ls -la *.iso 2>/dev/null || true
            exit 1
          fi
          # Ensure TelcoChisel-live.iso compatibility hardlink exists
          cp -l "$ISO" TelcoChisel-live.iso 2>/dev/null || cp "$ISO" TelcoChisel-live.iso 2>/dev/null || true

      # ── Boot smoke-test ──────────────────────────────────────────────────────
      # The build already verifies filesystem.squashfs is *readable* inside the
      # ISO, but not that the image actually *boots*. Run a headless QEMU/OVMF
      # boot and fail the release on a kernel panic. A missing qemu (e.g. a
      # self-hosted runner without it) downgrades to a warning rather than
      # blocking the publish.
      - name: Boot smoke-test the ISO (headless QEMU)
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf \
              || { echo "::warning::qemu unavailable — skipping ISO boot smoke-test"; exit 0; }
          fi
          bash scripts/test-iso-boot.sh --headless --uefi --timeout=120 "$ISO"

      # ── Post-build metadata ──────────────────────────────────────────────────
      - name: Generate Checksum & Metadata
        id: meta
        run: |
          set -eo pipefail
          SHA256=$(sha256sum "$ISO" | awk '{print $1}')
          MD5=$(md5sum "$ISO" | awk '{print $1}')
          SIZE=$(du -sh "$ISO" | cut -f1)
          printf '%s  %s\n' "$SHA256" "$ISO" > "${ISO}.sha256"
          printf '%s  %s\n' "$MD5" "$ISO" > "${ISO}.md5"
          if [ -f "TelcoChisel-live.iso" ]; then
            printf '%s  TelcoChisel-live.iso\n' "$SHA256" > "TelcoChisel-live.iso.sha256"
            printf '%s  TelcoChisel-live.iso\n' "$MD5" > "TelcoChisel-live.iso.md5"
          fi

          # Collect commits since last stable tag for the changelog
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname --merged HEAD 2>/dev/null | tail -n +1 | head -1 || true)
          if [[ -n "$LAST_TAG" ]]; then
            CHANGELOG=$(git log "${LAST_TAG}..HEAD" --oneline --no-decorate --max-count=30 || true)
          else
            CHANGELOG=$(git log --oneline --no-decorate --max-count=20 || true)
          fi
          # Store changelog as multiline output — use a random delimiter so
          # a commit message containing a bare "EOF" line cannot truncate the
          # output value and corrupt every downstream step that reads it.
          DELIM=$(openssl rand -hex 8)
          {
            echo "changelog<<${DELIM}"
            echo "$CHANGELOG"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "sha256=$SHA256"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

          echo "ISO: $SIZE | SHA256: $SHA256"

      # ── Artifact retention (safety net before publish steps) ─────────────────
      # Retains the ISO and sha256 for 7 days in case SourceForge/GH publish fails.
      # Split ONCE into workspace and copy chunks to /tmp/iso-chunks for upload.
      - name: Split ISO for artifact upload & GitHub Release
        run: |
          set -euo pipefail
          # Guard: build-iso.sh writes build-info.json at its very last step.
          # If the build exited early or used a non-standard path the file won't
          # exist, causing rsync, gh release upload, and artifact copy to fail.
          # Create a minimal placeholder so every downstream reference is safe.
          [ -f "${ISO}.build-info.json" ] || printf '{}' > "${ISO}.build-info.json"
          split -b 1900M "$ISO" "${ISO}.part-"
          mkdir -p /tmp/iso-chunks
          cp "${ISO}.part-"* "${ISO}.sha256" "${ISO}.build-info.json" /tmp/iso-chunks/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TelcoChisel-${{ steps.version.outputs.version }}-${{ steps.version.outputs.flavor }}
          path: /tmp/iso-chunks/
          retention-days: 7
          if-no-files-found: error

      # ── GitHub Actions step summary ──────────────────────────────────────────
      - name: Build Summary
        run: |
          {
            echo "## TelcoChisel Build — ${{ steps.version.outputs.version }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Version** | \`${{ steps.version.outputs.version }}\` |"
            echo "| **Date** | ${{ steps.version.outputs.date }} |"
            echo "| **ISO Size** | ${{ steps.meta.outputs.size }} |"
            echo "| **SHA-256** | \`${{ steps.meta.outputs.sha256 }}\` |"
            echo "| **Nightly** | ${{ steps.version.outputs.is_nightly }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Caches for Saving
        if: always() && env.RUNNER_ENVIRONMENT == 'github-hosted'
        run: |
          sudo chown -R runner:docker /root/.ccache || true
          sudo chown -R runner:docker /var/cache/apt-cacher-ng || true

      - name: Generate Release README for SourceForge
        env:
          VERSION:  ${{ steps.version.outputs.version }}
          DATE:     ${{ steps.version.outputs.date }}
          SIZE:     ${{ steps.meta.outputs.size }}
          SHA256:   ${{ steps.meta.outputs.sha256 }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: |
          cat << EOF > README.md
          # TelcoChisel $VERSION

          Advanced 5G/4G cellular security & telecom auditing live OS by TelcoSec.

          | Field | Value |
          |-------|-------|
          | **Build** | \`$VERSION\` |
          | **Date** | $DATE |
          | **ISO** | \`$ISO\` |
          | **ISO Size** | $SIZE |
          | **SHA-256** | \`$SHA256\` |
          | **Base** | Ubuntu 24.04 LTS (Noble Numbat) |

          ### ⬇ Download
          Download \`$ISO\` directly from this folder — it is a single, ready-to-write
          image. No extraction or reassembly is needed. (Split \`.part-*\` chunks exist
          only on the GitHub mirror, for GitHub's 2 GB per-asset limit.)

          Or always grab the current stable release via the one-click link:
          **https://sourceforge.net/projects/telcochisel/files/latest/download**

          ### Verify the download
          \`\`\`bash
          # Linux / macOS
          sha256sum -c $ISO.sha256
          # Windows PowerShell
          Get-FileHash .\\$ISO -Algorithm SHA256
          \`\`\`

          ### Write to USB
          \`\`\`bash
          lsblk                                        # find the target USB (e.g. /dev/sdX)
          sudo dd if=$ISO of=/dev/sdX bs=4M status=progress conv=fsync
          \`\`\`
          Or use BalenaEtcher / Rufus (DD Image mode). Boot via UEFI (Secure Boot
          disabled) or Legacy BIOS.

          > **Live boot credentials:** \`telcosec\` / \`telcosec\`

          ### Changes since last release
          \`\`\`text
          $CHANGELOG
          \`\`\`

          ---
          Docs: https://telcochisel.com · GitHub: https://github.com/TelcoChisel/TelcoChiselOS
          EOF

      # ── SourceForge FRS ──────────────────────────────────────────────────────
      # SourceForge is presented to users as the primary download host (see the
      # release notes below). If SF_SSH_KEY is absent every SF step below is
      # silently skipped (`if: env.HAS_SF_KEY == 'true'`) and the job still goes
      # green — surface that clearly in the job summary instead of a quiet no-op.
      - name: Warn if SourceForge publish will be skipped
        if: env.HAS_SF_KEY != 'true'
        run: |
          echo "### ⚠️ SourceForge publish SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`SF_SSH_KEY\` secret is not set — this run will publish to GitHub Releases only. The release notes link to SourceForge as the primary download; that link will 404 for this build." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::SF_SSH_KEY secret is absent — SourceForge publish skipped for this run"

      - name: Setup SSH for SourceForge
        if: env.HAS_SF_KEY == 'true'
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sf_deploy
          chmod 600 ~/.ssh/sf_deploy
          ssh-keyscan -H "$SF_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Orientation README at the Files root — someone landing on the SF
      # "Files" page via a bookmark or search result (not the direct-download
      # link) otherwise sees a bare folder listing (rolling/, v1.0.0/, ...)
      # with no explanation. Refreshes docs/SOURCEFORGE_FILES_README.md directly.
      - name: Upload SourceForge Files-root README
        if: env.HAS_SF_KEY == 'true'
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USER }}
          VERSION: ${{ steps.version.outputs.version }}
          DATE:    ${{ steps.version.outputs.date }}
          SIZE:    ${{ steps.meta.outputs.size }}
        run: |
          SF_ROOT="/home/frs/project/$SF_PROJECT"
          SF_TARGET="$SF_USER,$SF_PROJECT@$SF_HOST"
          SF_SSH="ssh -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR"

          cat > sftp_root_batch << EOF
          -mkdir /home/frs/project/$SF_PROJECT
          EOF
          sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_root_batch "$SF_TARGET" || true

          # The Files-root landing page is cosmetic — never let a missing or
          # failed README upload abort the actual ISO publish below.
          # Substitute the live version/size/date tokens into the in-repo
          # template so the landing page never goes stale between releases.
          if [ -f docs/SOURCEFORGE_FILES_README.md ]; then
            sed -e "s|@VERSION@|${VERSION:-latest}|g" \
                -e "s|@SIZE@|${SIZE:-see folder}|g" \
                -e "s|@DATE@|${DATE:-latest release}|g" \
              docs/SOURCEFORGE_FILES_README.md > /tmp/sf_root_readme.md
            rsync -av -e "$SF_SSH" \
              /tmp/sf_root_readme.md \
              "$SF_TARGET:$SF_ROOT/README.md" \
              && echo "✓ SF root README → https://sourceforge.net/projects/$SF_PROJECT/files/" \
              || echo "::warning::SF root README upload failed (non-fatal)"
          else
            echo "::warning::docs/SOURCEFORGE_FILES_README.md missing — skipping Files-root README"
          fi

      - name: Deploy to SourceForge — Nightly
        if: env.HAS_SF_KEY == 'true' && steps.version.outputs.is_nightly == 'true'
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USER }}
          VERSION:    ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SF_ROOT="/home/frs/project/$SF_PROJECT"
          SF_DIR="$SF_ROOT/rolling"
          SF_TMP="$SF_DIR/_upload_tmp"
          SF_TARGET="$SF_USER,$SF_PROJECT@$SF_HOST"
          SF_SSH="ssh -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR"

          # SourceForge's restricted shell blocks arbitrary SSH commands like 'mkdir',
          # but allows 'mkdir' via sftp. Clean up any stale staging subdir before upload.
          cat > sftp_batch << EOF
          cd $SF_ROOT
          -mkdir rolling
          -rm rolling/_upload_tmp/*
          -rmdir rolling/_upload_tmp
          -mkdir rolling/_upload_tmp
          EOF
          sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_batch "$SF_TARGET"

          # Upload into a private staging subdir first — a network blip or
          # runner timeout mid-transfer never touches the public path, so
          # nobody can download a partial/corrupt ISO mid-upload.
          # The TelcoChisel-live.iso compatibility copy is deliberately NOT
          # uploaded: SF stores it as a second full ~6 GB file (hardlinks don't
          # survive rsync), and "latest" is served by the pinned Default Download.
          rsync -avP --partial \
            -e "$SF_SSH" \
            "$ISO" "${ISO}.sha256" "${ISO}.md5" "${ISO}.build-info.json" \
            "README.md" \
            "$SF_TARGET:$SF_TMP/"

          # Publish: back up whatever's currently public (non-fatal — nothing
          # to back up on the very first upload), promote the newly uploaded
          # files into place, then clean up. If promotion fails partway, the
          # ".old" backups let a human manually restore the previous good
          # files instead of the public path serving nothing.
          cat > sftp_publish << SFTPEOF
          cd $SF_DIR
          -rename $ISO $ISO.old
          -rename ${ISO}.sha256 ${ISO}.sha256.old
          -rename ${ISO}.md5 ${ISO}.md5.old
          -rename ${ISO}.build-info.json ${ISO}.build-info.json.old
          -rename TelcoChisel-live.iso TelcoChisel-live.iso.old
          -rename TelcoChisel-live.iso.sha256 TelcoChisel-live.iso.sha256.old
          -rename TelcoChisel-live.iso.md5 TelcoChisel-live.iso.md5.old
          -rename README.md README.md.old
          rename _upload_tmp/$ISO $ISO
          rename _upload_tmp/${ISO}.sha256 ${ISO}.sha256
          rename _upload_tmp/${ISO}.md5 ${ISO}.md5
          rename _upload_tmp/${ISO}.build-info.json ${ISO}.build-info.json
          rename _upload_tmp/README.md README.md
          -rm $ISO.old
          -rm ${ISO}.sha256.old
          -rm ${ISO}.md5.old
          -rm ${ISO}.build-info.json.old
          -rm TelcoChisel-live.iso.old
          -rm TelcoChisel-live.iso.sha256.old
          -rm TelcoChisel-live.iso.md5.old
          -rm README.md.old
          -rm _upload_tmp/*
          -rmdir _upload_tmp
          SFTPEOF
          sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_publish "$SF_TARGET"

          # Retention: keep only the build just published. Nightly filenames
          # embed the commit SHA, so the renames above never overwrite older
          # builds — without this, every nightly leaves another ~6 GB behind.
          # rolling/ is the single SF home for nightlies (nightly/ is retired).
          printf 'cd %s\nls -1\n' "$SF_DIR" > sftp_ls
          STALE=$(sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_ls "$SF_TARGET" \
            | grep -v '^sftp>' | sed 's|.*/||' \
            | grep -E '^TelcoChisel-.*\.iso' | grep -vF "$ISO" || true)
          if [ -n "$STALE" ]; then
            { echo "cd $SF_DIR"; printf -- '-rm %s\n' $STALE; } > sftp_prune
            sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_prune "$SF_TARGET"
            echo "✓ Pruned stale nightly files:"; printf '  %s\n' $STALE
          fi
          echo "✓ SF rolling → https://sourceforge.net/projects/$SF_PROJECT/files/rolling/"

      - name: Deploy to SourceForge — Versioned Release
        if: env.HAS_SF_KEY == 'true' && steps.version.outputs.is_nightly == 'false'
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USER }}
          VERSION:    ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SF_ROOT="/home/frs/project/$SF_PROJECT"
          SF_DIR="$SF_ROOT/$VERSION"
          SF_TMP="$SF_DIR/_upload_tmp"
          SF_TARGET="$SF_USER,$SF_PROJECT@$SF_HOST"
          SF_SSH="ssh -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR"

          # SourceForge's restricted shell blocks arbitrary SSH commands like 'mkdir',
          # but allows 'mkdir' via sftp. Clean up any stale staging subdir before upload.
          cat > sftp_batch << EOF
          cd $SF_ROOT
          -mkdir $VERSION
          -rm $VERSION/_upload_tmp/*
          -rmdir $VERSION/_upload_tmp
          -mkdir $VERSION/_upload_tmp
          EOF
          sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_batch "$SF_TARGET"

          # Upload into a private staging subdir first — a network blip or
          # runner timeout mid-transfer never touches the public path, so
          # nobody can download a partial/corrupt ISO mid-upload.
          # The TelcoChisel-live.iso compatibility copy is deliberately NOT
          # uploaded: SF stores it as a second full ~6 GB file (hardlinks don't
          # survive rsync), and "latest" is served by the pinned Default Download.
          rsync -avP --partial \
            -e "$SF_SSH" \
            "$ISO" "${ISO}.sha256" "${ISO}.md5" "${ISO}.build-info.json" \
            "README.md" \
            "$SF_TARGET:$SF_TMP/"

          # Publish: back up whatever's currently public (non-fatal — nothing
          # to back up on the very first upload of this version), promote the
          # newly uploaded files into place, then clean up.
          cat > sftp_publish << SFTPEOF
          cd $SF_DIR
          -rename $ISO $ISO.old
          -rename ${ISO}.sha256 ${ISO}.sha256.old
          -rename ${ISO}.md5 ${ISO}.md5.old
          -rename ${ISO}.build-info.json ${ISO}.build-info.json.old
          -rename TelcoChisel-live.iso TelcoChisel-live.iso.old
          -rename TelcoChisel-live.iso.sha256 TelcoChisel-live.iso.sha256.old
          -rename TelcoChisel-live.iso.md5 TelcoChisel-live.iso.md5.old
          -rename README.md README.md.old
          rename _upload_tmp/$ISO $ISO
          rename _upload_tmp/${ISO}.sha256 ${ISO}.sha256
          rename _upload_tmp/${ISO}.md5 ${ISO}.md5
          rename _upload_tmp/${ISO}.build-info.json ${ISO}.build-info.json
          rename _upload_tmp/README.md README.md
          -rm $ISO.old
          -rm ${ISO}.sha256.old
          -rm ${ISO}.md5.old
          -rm ${ISO}.build-info.json.old
          -rm TelcoChisel-live.iso.old
          -rm TelcoChisel-live.iso.sha256.old
          -rm TelcoChisel-live.iso.md5.old
          -rm README.md.old
          -rm _upload_tmp/*
          -rmdir _upload_tmp
          SFTPEOF
          sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_publish "$SF_TARGET"
          echo "✓ SF versioned → https://sourceforge.net/projects/$SF_PROJECT/files/$VERSION/"

      # Retention for stable releases: SourceForge has a finite project quota and
      # each vX.Y.Z/ ISO is ~5-6 GB. Without pruning, every release adds another
      # ISO forever. Keep the newest KEEP_STABLE version folders' ISOs; from older
      # folders delete only the heavy *.iso (leave checksums/build-info/README for
      # provenance — they are < 1 KB). GitHub Releases remains the full archive.
      - name: Prune old stable ISOs on SourceForge
        if: env.HAS_SF_KEY == 'true' && steps.version.outputs.is_nightly == 'false'
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USER }}
          KEEP_STABLE: "2"
        run: |
          set -euo pipefail
          SF_ROOT="/home/frs/project/$SF_PROJECT"
          SF_TARGET="$SF_USER,$SF_PROJECT@$SF_HOST"

          # List version folders (vMAJOR.MINOR[.PATCH]) at the project root.
          printf 'cd %s\nls -1\n' "$SF_ROOT" > sftp_vls
          VERSIONS=$(sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_vls "$SF_TARGET" \
            | grep -v '^sftp>' | sed 's|.*/||' \
            | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V -r || true)

          KEPT=0
          PRUNE_DIRS=""
          for v in $VERSIONS; do
            KEPT=$((KEPT + 1))
            if [ "$KEPT" -le "${KEEP_STABLE}" ]; then
              echo "keep   $v"
            else
              echo "prune  $v (ISO only)"
              PRUNE_DIRS="$PRUNE_DIRS $v"
            fi
          done

          if [ -z "$PRUNE_DIRS" ]; then
            echo "Nothing to prune (<= ${KEEP_STABLE} stable versions present)."
            exit 0
          fi

          # Delete only the large .iso from each pruned folder; keep companions.
          {
            echo "cd $SF_ROOT"
            for d in $PRUNE_DIRS; do
              printf -- '-rm %s/*.iso\n' "$d"
            done
          } > sftp_oldprune
          sftp -i ~/.ssh/sf_deploy -o BatchMode=yes -o LogLevel=ERROR -b sftp_oldprune "$SF_TARGET"
          echo "✓ Pruned old-release ISOs:$PRUNE_DIRS"

      - name: Pin Default Download on SourceForge
        if: >-
          steps.version.outputs.is_nightly == 'false' &&
          env.HAS_SF_KEY == 'true' &&
          env.HAS_SF_API == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
        run: |
          if [ -n "${SF_API_KEY:-}" ]; then
            echo "Setting default download on SourceForge for ${VERSION}/${ISO}..."
            HTTP_CODE=$(curl -s -o /tmp/sf_api_resp.txt -w "%{http_code}" -X PUT \
              -H "Accept: application/json" \
              -d "default=windows&default=mac&default=linux&default=bsd&default=solaris&default=others" \
              --data-urlencode "download_label=Download TelcoChisel OS ${VERSION} (Ubuntu 24.04 LTS, 100 Telecom Tools)" \
              -d "api_key=${SF_API_KEY}" \
              "https://sourceforge.net/projects/${SF_PROJECT}/files/${VERSION}/${ISO}")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              echo "✓ Successfully pinned ${VERSION}/${ISO} with custom label as default download on SourceForge"
            else
              echo "⚠️ SourceForge Release API returned HTTP $HTTP_CODE (non-fatal)"
              cat /tmp/sf_api_resp.txt 2>/dev/null || true
            fi
          else
            echo "ℹ️ SF_API_KEY not set — skipping automated default download update"
          fi

      # ── GitHub Releases ──────────────────────────────────────────────────────
      # Chunks were already produced in the earlier single-split step.
      - name: Verify ISO split parts for GitHub Release
        run: |
          ls -lh "${ISO}.part-"*

      - name: Publish Nightly GitHub Release
        if: steps.version.outputs.is_nightly == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:  ${{ steps.version.outputs.version }}
          DATE:     ${{ steps.version.outputs.date }}
          SIZE:     ${{ steps.meta.outputs.size }}
          SHA256:   ${{ steps.meta.outputs.sha256 }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: |
          set -euo pipefail
          NOTES=$(cat << EOF
          ## TelcoChisel — Nightly Build

          | Field | Value |
          |-------|-------|
          | **Build** | \`${VERSION}\` |
          | **Date** | ${DATE} |
          | **ISO Size** | ${SIZE} |
          | **SHA-256** | \`${SHA256}\` |

          ### ⬇ Download (single file — no reassembly needed)
          **[SourceForge →](https://sourceforge.net/projects/telcochisel/files/rolling/)**
          Direct download, no size limit, resumable.

          ### Download from GitHub (split parts)
          Download all \`.part-*\` files and the \`.sha256\` file, then:
          \`\`\`bash
          cat ${ISO}.part-* > ${ISO}
          sha256sum -c ${ISO}.sha256
          \`\`\`

          ### Changes since last release
          \`\`\`
          ${CHANGELOG}
          \`\`\`

          > **Live boot credentials:** \`telcosec:telcosec\`
          EOF
          )
          # Manage the "rolling" tag via the REST API instead of git-push so
          # that push-path protections (GH013) are never triggered.
          # Try to move the existing tag ref first (PATCH = atomic update).
          # If the ref doesn't exist yet the API returns 422, so fall back to
          # creating it (POST). At every point a valid rolling tag exists.
          ROLLING_TAG="rolling"
          ROLLING_SHA=$(git rev-parse HEAD)
          REPO="${GITHUB_REPOSITORY}"
          if gh api "repos/${REPO}/git/refs/tags/${ROLLING_TAG}" \
               --method PATCH \
               -f sha="${ROLLING_SHA}" \
               -F force=true \
               > /dev/null 2>&1; then
            echo "✓ ${ROLLING_TAG} tag ref updated to ${ROLLING_SHA}"
          else
            gh api "repos/${REPO}/git/refs" \
              --method POST \
              -f ref="refs/tags/${ROLLING_TAG}" \
              -f sha="${ROLLING_SHA}"
            echo "✓ ${ROLLING_TAG} tag ref created at ${ROLLING_SHA}"
          fi

          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            # Purge all stale assets before re-uploading — part filenames
            # embed the build SHA so --clobber never matches across runs;
            # without this, old parts accumulate indefinitely.
            gh release view "$ROLLING_TAG" --json assets --jq '.assets[].name' \
              | xargs -I{} gh release delete-asset "$ROLLING_TAG" {} --yes 2>/dev/null || true
            gh release edit "$ROLLING_TAG" \
              --prerelease \
              --title "TelcoChisel Rolling — Nightly ${DATE}" \
              --notes "$NOTES"
            gh release upload "$ROLLING_TAG" \
              ${ISO}.part-* "${ISO}.sha256" "${ISO}.build-info.json" \
              --clobber
          else
            gh release create "$ROLLING_TAG" \
              ${ISO}.part-* "${ISO}.sha256" "${ISO}.build-info.json" \
              --prerelease \
              --title "TelcoChisel Rolling — Nightly ${DATE}" \
              --notes "$NOTES"
          fi

      - name: Publish Versioned GitHub Release
        if: steps.version.outputs.is_nightly == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "TelcoChisel ${{ steps.version.outputs.version }}"
          make_latest: true
          generate_release_notes: true
          body: |
            | Field | Value |
            |-------|-------|
            | **ISO Size** | ${{ steps.meta.outputs.size }} |
            | **Built** | ${{ steps.version.outputs.date }} |
            | **SHA-256** | `${{ steps.meta.outputs.sha256 }}` |

            ### ⬇ Download (single file — no reassembly needed)
            **[SourceForge →](https://sourceforge.net/projects/telcochisel/files/${{ steps.version.outputs.version }}/)**
            Direct download, no size limit, resumable.

            ### Download from GitHub (split parts)
            Download all `.part-*` files and the `.sha256` file, then:
            ```bash
            cat ${{ env.ISO }}.part-* > ${{ env.ISO }}
            sha256sum -c ${{ env.ISO }}.sha256
            ```

            > **Live boot credentials:** `telcosec:telcosec`
          files: |
            ${{ env.ISO }}.part-*
            ${{ env.ISO }}.sha256
            ${{ env.ISO }}.build-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
