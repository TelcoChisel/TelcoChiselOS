name: CI Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single job: one checkout / runner bootstrap. Go CLI CI lives in
# TelcoChisel/telcosec-cli — not duplicated here.
jobs:
  validate:
    name: Lint & Catalog Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history for PR base diffs; shallow would break catalog path gating.
          fetch-depth: 0

      - name: Detect catalog-related changes
        id: changes
        run: |
          RUN_CATALOGS=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_CATALOGS=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            if ! git diff --name-only "$BASE"...HEAD | grep -qE '^(docs/data/|data/|builder/docs/|scripts/(sync-catalogs|validate_all_tools))'; then
              RUN_CATALOGS=false
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                 | grep -qE '^(docs/data/|data/|builder/docs/|scripts/(sync-catalogs|validate_all_tools))'; then
              RUN_CATALOGS=false
            fi
          fi
          echo "catalogs=${RUN_CATALOGS}" >> "$GITHUB_OUTPUT"
          echo "Catalog checks: ${RUN_CATALOGS}"

      - name: Install ShellCheck and PyYAML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3-yaml

      - name: Verify bash syntax across all scripts
        run: bash scripts/test_syntax.sh

      - name: ShellCheck on critical scripts
        run: |
          shellcheck --severity=error \
            scripts/install-telcochisel-repo.sh \
            docker/scripts/install-apt-key.sh \
            builder/scripts/lib/record-tool.sh \
            builder/scripts/lib/build-tool.sh \
            builder/scripts/lib/pip-retry.sh

      - name: Check for unwanted CRLF in shell scripts
        run: |
          ERRORS=0
          while IFS= read -r -d '' file; do
            if grep -q $'\r' "$file"; then
              echo "::error file=$file::CRLF line endings detected in $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -type f \( -name "*.sh" -o -path "*/bin/telcosec*" \) -not -path "*/.git/*" -print0)
          if [ "$ERRORS" -gt 0 ]; then
            echo "Failed: $ERRORS files contain Windows CRLF line endings. Run python scripts/fix_crlf.py"
            exit 1
          fi
          echo "✓ All shell and binary launchers use Unix LF line endings"

      - name: Validate YAML files
        run: |
          python3 -c "
          import glob, yaml, sys
          files = glob.glob('.github/workflows/*.yml') + glob.glob('docker/**/*.yaml', recursive=True) + glob.glob('docker/**/*.yml', recursive=True)
          errors = 0
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as stream:
                      yaml.safe_load(stream)
                  print(f'[OK] Valid YAML: {f}')
              except Exception as e:
                  print(f'[ERROR] Invalid YAML: {f} -> {e}')
                  errors += 1
          if errors > 0:
              sys.exit(1)
          "

      # Pinned actionlint lints every workflow for syntax, expression,
      # needs/outputs and glob errors the plain YAML parse above cannot catch.
      # Embedded-shell linting runs shellcheck at error severity only (this
      # repo's existing ShellCheck policy), so pre-existing style/info findings
      # in the long build scripts do not block CI. Prose kept as a YAML comment
      # here — not inside run: — so shellcheck does not parse it as a directive.
      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          AL_VER=1.7.7
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${AL_VER}/actionlint_${AL_VER}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color -shellcheck="shellcheck --severity=error"

      - name: Setup Node.js
        if: steps.changes.outputs.catalogs == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Verify catalog parity across doc portals
        if: steps.changes.outputs.catalogs == 'true'
        run: node scripts/sync-catalogs.js

      - name: Validate tool definitions
        if: steps.changes.outputs.catalogs == 'true'
        run: node scripts/validate_all_tools.js
