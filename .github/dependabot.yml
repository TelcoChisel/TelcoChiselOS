version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The Nuxt docs portal moved to the TelcoChisel/website repo; this tree no
  # longer contains a package.json, so there is no npm ecosystem to scan here.

  - package-ecosystem: gomod
    directory: /packages/telcosec-cli
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # Dockerfiles live in two places: the container images under /docker and the
  # ISO builder image at the repo root (Dockerfile.builder).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
