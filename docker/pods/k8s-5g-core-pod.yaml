apiVersion: v1
kind: Pod
metadata:
  name: telcochisel-5g-core-pod
  namespace: default
  labels:
    app.kubernetes.io/name: telcochisel-5g-core
    app.kubernetes.io/part-of: telcochisel
    app.kubernetes.io/component: core-network
    net.telcosec.tier: core-network
  annotations:
    description: "TelcoChisel 5G Standalone (SA) Core and RAN simulation multi-container pod"
    net.telcosec.academy.lab: "https://app.telcosec.net/labs/5g-core-audit"
spec:
  # Containers within the pod share IPC and localhost networking
  shareProcessNamespace: true
  restartPolicy: Always
  containers:
    # ─── 1. Open5GS / 5G Core Network Simulation Container ──────────────────
    - name: open5gs-core
      image: ghcr.io/telcochisel/telcochisel-core-network:latest
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - |
          echo "================================================================"
          echo "  TelcoChisel 5G Core Network Pod (Open5GS + srsRAN)"
          echo "  SCTP NGAP: 38412 | GTP-U: 2152 | PFCP: 8805 | WebUI: 7777"
          echo "  Training & Labs: https://app.telcosec.net"
          echo "================================================================"
          sleep infinity
      securityContext:
        privileged: false
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      ports:
        - name: ngap-sctp
          containerPort: 38412
          protocol: SCTP
        - name: gtpu-udp
          containerPort: 2152
          protocol: UDP
        - name: pfcp-udp
          containerPort: 8805
          protocol: UDP
        - name: webui-tcp
          containerPort: 7777
          protocol: TCP
        - name: sbi-tcp
          containerPort: 9090
          protocol: TCP
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      livenessProbe:
        exec:
          command:
            - /usr/local/bin/container-healthcheck.sh
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
      volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
        - name: shared-captures
          mountPath: /captures

    # ─── 2. UERANSIM / Traffic Generator Container ───────────────────────────
    - name: ueransim-tester
      image: ghcr.io/telcochisel/telcochisel-base:latest
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - |
          echo "================================================================"
          echo "  TelcoChisel UERANSIM / RAN Tester Container"
          echo "  Loopback connectivity to 5G Core AMF via 127.0.0.1:38412"
          echo "================================================================"
          sleep infinity
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "2Gi"
      livenessProbe:
        exec:
          command:
            - /usr/local/bin/container-healthcheck.sh
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
      volumeMounts:
        - name: shared-captures
          mountPath: /captures

  volumes:
    - name: dev-net-tun
      hostPath:
        path: /dev/net/tun
        type: CharDevice
    - name: shared-captures
      emptyDir: {}
