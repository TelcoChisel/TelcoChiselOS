apiVersion: v1
kind: Pod
metadata:
  name: telcochisel-telecom-suite-pod
  namespace: default
  labels:
    app.kubernetes.io/name: telcochisel-telecom-suite
    app.kubernetes.io/part-of: telcochisel
    app.kubernetes.io/component: full-suite
    net.telcosec.tier: suite
  annotations:
    description: "TelcoChisel unified multi-tier telecom red team penetration testing suite pod"
    net.telcosec.academy.lab: "https://app.telcosec.net/labs"
spec:
  shareProcessNamespace: true
  restartPolicy: Always
  containers:
    # ─── 1. Protocol Auditor & Signaling Exploitation ────────────────────────
    - name: protocol-auditor
      image: ghcr.io/telcochisel/telcochisel-base:latest
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - |
          echo "================================================================"
          echo "  TelcoChisel Protocol Auditor & Red Team Engine"
          echo "  Tools: sctpscan, SigPloit, Diafuzzer, Scapy, SIPVicious, asleap"
          echo "  Shared volumes: /captures | /reports"
          echo "  Training & Labs: https://app.telcosec.net"
          echo "================================================================"
          sleep infinity
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      livenessProbe:
        exec:
          command:
            - /usr/local/bin/container-healthcheck.sh
        initialDelaySeconds: 10
        periodSeconds: 30
      volumeMounts:
        - name: shared-captures
          mountPath: /captures
        - name: shared-reports
          mountPath: /reports

    # ─── 2. Core Network & RAN Simulation ────────────────────────────────────
    - name: core-network-lab
      image: ghcr.io/telcochisel/telcochisel-core-network:latest
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - |
          echo "================================================================"
          echo "  TelcoChisel 5G SA Core & RAN Simulation Engine"
          echo "  Tools: Open5GS, srsRAN, 5Ghoul, gtp5g-load"
          echo "================================================================"
          sleep infinity
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      livenessProbe:
        exec:
          command:
            - /usr/local/bin/container-healthcheck.sh
        initialDelaySeconds: 10
        periodSeconds: 30
      volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
        - name: shared-captures
          mountPath: /captures
        - name: shared-reports
          mountPath: /reports

    # ─── 3. SDR RF Spectrum & Cellular Sniffing ──────────────────────────────
    - name: sdr-rf-monitor
      image: ghcr.io/telcochisel/telcochisel-sdr:latest
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - |
          echo "================================================================"
          echo "  TelcoChisel SDR RF Cellular Monitor"
          echo "  Tools: SoapySDR, UHD, HackRF, LimeSuite, BladeRF, GQRX"
          echo "================================================================"
          sleep infinity
      securityContext:
        capabilities:
          add:
            - SYS_NICE
      resources:
        requests:
          cpu: "1000m"
          memory: "2Gi"
        limits:
          cpu: "4000m"
          memory: "8Gi"
      livenessProbe:
        exec:
          command:
            - /usr/local/bin/container-healthcheck.sh
        initialDelaySeconds: 15
        periodSeconds: 30
      volumeMounts:
        - name: dev-bus-usb
          mountPath: /dev/bus/usb
        - name: shared-captures
          mountPath: /captures

  volumes:
    - name: dev-net-tun
      hostPath:
        path: /dev/net/tun
        type: CharDevice
    - name: dev-bus-usb
      hostPath:
        path: /dev/bus/usb
        type: Directory
    - name: shared-captures
      emptyDir: {}
    - name: shared-reports
      emptyDir: {}
