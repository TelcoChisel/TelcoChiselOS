# =============================================================================
# TelcoChisel container images — Docker Compose service definitions.
#
# Each service is standalone; run just the one you need:
#   docker compose -f docker/compose.yaml run --rm base
#   docker compose -f docker/compose.yaml run --rm sdr
#   docker compose -f docker/compose.yaml run --rm core-network
#   docker compose -f docker/compose.yaml run --rm device-tools
#   docker compose -f docker/compose.yaml run --rm 5ghoul
#
# Build all four locally (build context is the repo root — run compose from
# there, or pass -f docker/compose.yaml from anywhere):
#   docker compose -f docker/compose.yaml build
#
# See docker/README.md for what each privilege/device flag below is for and
# which tools need it.
# =============================================================================
services:
  base:
    image: ghcr.io/telcochisel/telcochisel-base:latest
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
    init: true
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  sdr:
    image: ghcr.io/telcochisel/telcochisel-sdr:latest
    build:
      context: ..
      dockerfile: docker/sdr.Dockerfile
    init: true
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # USB SDR passthrough (HackRF/USRP/LimeSDR/BladeRF/RTL-SDR). Swap the
    # explicit device list for `privileged: true` if your host doesn't
    # support --device for USB (e.g. Docker Desktop on Windows/Mac).
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # X11 passthrough for gqrx / gnuradio-companion (Linux host only).
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro

  core-network:
    image: ghcr.io/telcochisel/telcochisel-core-network:latest
    build:
      context: ..
      dockerfile: docker/core-network.Dockerfile
    init: true
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Host networking is the simplest way to get SCTP/GTP-U traffic and the
    # ogstun interface working end-to-end; see docker/README.md for the
    # bridge-network alternative if host networking isn't acceptable.
    network_mode: host
    # docker.sock is NOT mounted by default (host root equivalent).
    # Opt in only when running `open5gs-install` nested compose:
    #   docker compose -f docker/compose.yaml -f docker/compose.docker-sock.yaml up core-network

  device-tools:
    image: ghcr.io/telcochisel/telcochisel-device-tools:latest
    build:
      context: ..
      dockerfile: docker/device-tools.Dockerfile
    init: true
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # Serial USB modems/flash-mode devices enumerate as /dev/ttyUSB*/ttyACM*
    # at run time (dynamic — can't be listed here). Prefer:
    #   docker run --device /dev/ttyUSB0 ... telcochisel-device-tools
    # or --privileged for exploratory use.

  5ghoul:
    image: ghcr.io/telcochisel/telcochisel-5ghoul:latest
    build:
      context: ..
      dockerfile: docker/5ghoul.Dockerfile
    init: true
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/net/tun:/dev/net/tun
    environment:
      TELCOSEC_5GHOUL_RADIO: BLADERF
